tags:
  - Auth
summary: Login user
operationId: loginUser
description: Logs in a user and returns an access token.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            description: User email
            example: 'johndoe@example.com'
          password:
            type: string
            format: password
            description: User password
            example: 'securepassword123'
responses:
  '200':
    description: Successfully logged in an user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'NScU4mnfh2oyHZGA+GjM8W1ryLmqC95Y9SyFN2oT'

  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
