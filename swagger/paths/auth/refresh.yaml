tags:
  - Auth
summary: Refresh session
operationId: refreshUserSession
description: Refreshes the session and returns a new access token.
security: []

responses:
  '200':
    description: Successfully refreshed a session
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'NScU4mnfh2oyHZGA+GjM8W1ryLmqC95Y9SyFN2oT'

  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
