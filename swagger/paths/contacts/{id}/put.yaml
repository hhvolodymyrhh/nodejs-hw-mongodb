tags:
  - Contacts
summary: create contact by id
operationId: put_create_contact
description: 'create contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's number"
            type: string
            example: +380991122330
          email:
            description: "Contact's email"
            type: string
            example: email@gmail.com
          isFavourite:
            description: 'Whether the contact is marked as favourite'
            type: boolean
            example: false
          contactType:
            description: 'Type of contact (e.g., work, personal, home)'
            type: string
            enum: ['work', 'personal', 'home']
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: 'Create contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully upserted a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
