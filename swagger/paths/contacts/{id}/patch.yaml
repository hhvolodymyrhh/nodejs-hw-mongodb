tags:
  - Contacts
summary: update contact by id
operationId: patch_update_contact
description: 'update contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object

        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's number"
            type: string
            example: +380991122330
          email:
            description: "Contact's email"
            type: string
            example: email@gmail.com
          isFavourite:
            description: 'Whether the contact is marked as favourite'
            type: boolean
            example: false
          contactType:
            description: 'Type of contact (e.g., work, personal, home)'
            type: string
            enum: ['work', 'personal', 'home']
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: 'Update contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact_update.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
